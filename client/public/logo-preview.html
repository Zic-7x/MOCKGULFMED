<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ClickToGulf & ClickToGulf Exams Logo System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #f8fafc;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      color: #0f172a;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 24px;
    }
    .preview-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 32px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.04);
    }
    .preview-card.dark {
      background: #071726;
      border-color: #1e293b;
      color: #ffffff;
    }
    .preview-card.navy {
      background: #0a2540;
      border-color: #1a365d;
      color: #ffffff;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 32px;
      flex-wrap: wrap;
    }
    .icon-box {
      width: 64px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-box-small {
      width: 40px;
      height: 40px;
    }
  </style>
</head>
<body>
  <h1>ClickToGulf &amp; ClickToGulf Exams Brand Identity System</h1>

  <!-- ClickToGulf Exams Brand Logo -->
  <div class="preview-card">
    <h3>1. ClickToGulf Exams Brand Logo (Light Theme)</h3>
    <div style="max-width: 720px; width: 100%;">
      <img src="/clicktogulf-exams-logo.svg" alt="ClickToGulf Exams Logo" style="width: 100%; height: auto;" />
    </div>
  </div>

  <div class="preview-card dark">
    <h3>2. ClickToGulf Exams Brand Logo (Dark Theme Preview)</h3>
    <div style="max-width: 720px; width: 100%;">
      <img src="/clicktogulf-exams-logo.svg" alt="ClickToGulf Exams Logo" style="width: 100%; height: auto;" />
    </div>
  </div>

  <div class="preview-card">
    <h3>3. ClickToGulf Main Platform Logo (Licensing)</h3>
    <div style="max-width: 720px; width: 100%;">
      <img src="/clicktogulf-logo.svg" alt="ClickToGulf Logo" style="width: 100%; height: auto;" />
    </div>
  </div>

  <div class="preview-card">
    <h3>4. Icon Emblem at Multiple Scales</h3>
    <div class="row">
      <div>
        <div style="font-size: 12px; color: #64748b; margin-bottom: 8px;">120px Display</div>
        <img src="/clicktogulf-icon.svg" style="width: 120px; height: 120px;" />
      </div>
      <div>
        <div style="font-size: 12px; color: #64748b; margin-bottom: 8px;">64px App Icon</div>
        <img src="/clicktogulf-icon.svg" style="width: 64px; height: 64px;" />
      </div>
      <div>
        <div style="font-size: 12px; color: #64748b; margin-bottom: 8px;">44px Nav Badge</div>
        <img src="/clicktogulf-icon.svg" style="width: 44px; height: 44px;" />
      </div>
      <div>
        <div style="font-size: 12px; color: #64748b; margin-bottom: 8px;">24px Favicon</div>
        <img src="/clicktogulf-icon.svg" style="width: 24px; height: 24px;" />
      </div>
    </div>
  </div>
</body>
</html>
