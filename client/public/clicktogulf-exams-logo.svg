<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 240" width="100%" height="100%" role="img" aria-label="ClickToGulf Exams - Gulf Healthcare Licensing &amp; CBT Exam Simulation">
  <defs>
    <!-- Primary Gradients -->
    <linearGradient id="ctgExamsTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2f5"/>
      <stop offset="35%" stop-color="#009ebd"/>
      <stop offset="100%" stop-color="#006f8c"/>
    </linearGradient>

    <linearGradient id="ctgExamsNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48"/>
      <stop offset="50%" stop-color="#07192e"/>
      <stop offset="100%" stop-color="#030c17"/>
    </linearGradient>

    <linearGradient id="ctgExamsRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38e1ff"/>
      <stop offset="40%" stop-color="#00a3c7"/>
      <stop offset="70%" stop-color="#027394"/>
      <stop offset="100%" stop-color="#071e36"/>
    </linearGradient>

    <linearGradient id="ctgExamsVerify" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="ctgExamsGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="ctgWordmarkTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#008eb0"/>
      <stop offset="100%" stop-color="#00accf"/>
    </linearGradient>

    <linearGradient id="ctgWordmarkNavy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#071b30"/>
      <stop offset="100%" stop-color="#0d2847"/>
    </linearGradient>

    <!-- Vibrant Exams Badge Gradient -->
    <linearGradient id="ctgExamsBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b4d8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <linearGradient id="ctgDividerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00a8cc" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00a8cc" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#0a2540" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a2540" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ctgRuleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#009ebd"/>
      <stop offset="30%" stop-color="#00b8db"/>
      <stop offset="70%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#0a2540" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="ctgMainShadow" x="-20%" y="-15%" width="140%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#03101d" flood-opacity="0.32"/>
    </filter>

    <radialGradient id="ctgMainBackdrop" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(-8, 0)">
    <circle cx="120" cy="118" r="96" fill="url(#ctgMainBackdrop)"/>

    <g filter="url(#ctgMainShadow)">
      <!-- Orbital Crescent -->
      <path d="M 36,156 C 14,122 18,74 48,46 C 42,60 38,78 40,98 C 45,142 80,186 128,210 C 166,228 206,218 226,196 C 204,216 162,224 124,206 C 78,184 46,146 36,156 Z"
            fill="url(#ctgExamsTeal)" opacity="0.9"/>
      
      <path d="M 48,168 C 24,136 26,92 54,60 C 51,70 50,82 52,96 C 56,132 82,172 126,194 C 158,210 192,206 214,188 C 192,204 154,210 120,196 C 84,180 58,152 48,168 Z"
            fill="url(#ctgExamsRim)" opacity="0.6"/>

      <!-- Shield Frame -->
      <path d="M 120,24 C 160,24 198,36 206,62 C 215,98 208,152 172,190 C 150,214 132,226 120,232 C 108,226 90,214 68,190 C 32,152 25,98 34,62 C 42,36 80,24 120,24 Z"
            fill="url(#ctgExamsNavy)"
            stroke="url(#ctgExamsRim)"
            stroke-width="5"
            stroke-linejoin="round"/>

      <!-- Inner Pinstripe -->
      <path d="M 120,35 C 152,35 183,45 191,67 C 199,96 193,143 163,177 C 144,198 130,208 120,214 C 110,208 96,198 77,177 C 47,143 41,96 49,67 C 57,45 88,35 120,35 Z"
            fill="none"
            stroke="url(#ctgExamsTeal)"
            stroke-width="1.8"
            stroke-dasharray="7 3.5"
            opacity="0.45"/>

      <!-- Cross & Verification -->
      <g transform="translate(120, 122)">
        <rect x="-13" y="-48" width="26" height="88" rx="6" fill="#ffffff"/>
        <rect x="-44" y="-17" width="88" height="26" rx="6" fill="#ffffff"/>
        <path d="M -32,-3 L -12,17 C -9,20 -4,20 -1,17 L 36,-20 L 46,-12 L 48,-42 L 18,-38 L 27,-29 L -6,4 L -22,-12 Z"
              fill="url(#ctgExamsVerify)"/>
        <path d="M -30,-3 L -12,15 C -9,18 -4,18 -1,15 L 34,-20"
              fill="none"
              stroke="#ffffff"
              stroke-width="2.5"
              stroke-linecap="round"
              opacity="0.9"/>
        <circle cx="0" cy="-4" r="5" fill="#ffffff"/>
        <circle cx="0" cy="-4" r="3" fill="#009ebd"/>
      </g>

      <!-- Apex Guidance Star -->
      <g transform="translate(120, 48)">
        <path d="M 0,-11 C 1.2,-3.5 3.5,-1.2 11,0 C 3.5,1.2 1.2,3.5 0,11 C -1.2,3.5 -3.5,1.2 -11,0 C -3.5,-1.2 -1.2,-3.5 0,-11 Z"
              fill="url(#ctgExamsGold)"/>
        <circle cx="0" cy="0" r="1.8" fill="#ffffff"/>
      </g>
      <circle cx="188" cy="74" r="3.5" fill="#00d2f5" opacity="0.85"/>
    </g>
  </g>

  <!-- Divider -->
  <line x1="238" y1="42" x2="238" y2="198" stroke="url(#ctgDividerGrad)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Typography Lockup -->
  <g transform="translate(262, 0)">
    <!-- Row 1: CLICK to GULF + EXAMS -->
    <text x="0" y="104" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-size="80" font-weight="800" letter-spacing="-0.5" fill="url(#ctgWordmarkTeal)">
      CLICK
    </text>
    <text x="260" y="104" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-size="52" font-weight="600" letter-spacing="0" fill="#64748b">
      to
    </text>
    <text x="328" y="104" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-size="82" font-weight="900" letter-spacing="2" fill="url(#ctgWordmarkNavy)">
      GULF
    </text>

    <!-- EXAMS Pill Badge -->
    <g transform="translate(566, 52)">
      <rect x="0" y="0" width="144" height="54" rx="10" fill="url(#ctgExamsBadgeGrad)" stroke="#38e1ff" stroke-width="1.5"/>
      <text x="72" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-size="30" font-weight="900" letter-spacing="3" fill="#ffffff">
        EXAMS
      </text>
      <!-- Subtle spark dot -->
      <circle cx="132" cy="12" r="3" fill="#fef08a"/>
    </g>

    <!-- Star Accent -->
    <g transform="translate(554, 46)">
      <path d="M 0,-6 C 0.8,-2 2,-0.8 6,0 C 2,0.8 0.8,2 0,6 C -0.8,2 -2,0.8 -6,0 C -2,-0.8 -0.8,-2 0,-6 Z" fill="#00a8cc"/>
    </g>

    <!-- Accent Rule -->
    <line x1="2" y1="126" x2="710" y2="126" stroke="url(#ctgRuleGrad)" stroke-width="2.2" stroke-linecap="round"/>
    <rect x="0" y="123.5" width="5" height="5" transform="rotate(45 2.5 126)" fill="#009ebd"/>

    <!-- Tagline -->
    <text x="2" y="156" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-size="19" font-weight="800" letter-spacing="4.2" fill="#071b30">
      GULF HEALTHCARE LICENSING &amp; CBT EXAM SIMULATION
    </text>

    <!-- Authorities Strip -->
    <text x="3" y="186" font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" letter-spacing="2.6" fill="#0084a8">
      DHA • DOH / HAAD • MOHAP • SCFHS • MOPH • OMSB • NHRA • PROMETRIC • PEARSON VUE
    </text>
  </g>
</svg>
